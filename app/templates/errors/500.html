{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <h1 class="display-1 text-warning fw-bold">500</h1>
        <h3 class="mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected error occurred on the server. Our technical log has registered the event.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
    </div>
</div>
{% endblock %}
