{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <h1 class="display-1 text-danger fw-bold">404</h1>
        <h3 class="mb-3">Page Not Found</h3>
        <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
    </div>
</div>
{% endblock %}
