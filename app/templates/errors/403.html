{% extends "base.html" %}

{% block title %}403 - Access Forbidden{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 text-center">
    <div class="col-md-6">
        <h1 class="display-1 text-secondary fw-bold">403</h1>
        <h3 class="mb-3">Access Forbidden</h3>

        <a href="{{ url_for('main.index') }}" class="btn btn-primary rounded-pill px-4">Return Home</a>
    </div>
</div>
{% endblock %}
